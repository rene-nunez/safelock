[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safelock-backend"
version = "0.1.0"
description = "Safelock backend API"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.163",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "aiomqtt>=2.5",
  "pymongo>=4.20",
  "pwdlib[argon2]>=0.4",
  "pyjwt>=2.10",
  "email-validator>=2.4",
]

[project.optional-dependencies]
dev = [
  "pyserial>=3.5",
  "types-pyserial>=3.5",
  "httpx>=0.28",
  "mypy>=2.4",
  "pytest>=9.2",
  "pytest-asyncio>=1.5",
  "ruff>=0.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
