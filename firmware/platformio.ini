; PlatformIO Project Configuration File

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
  -I include
  -DMFRC522_SPICLOCK=500000
  -DCORE_DEBUG_LEVEL=3

build_src_filter =
  +<main.cpp>

lib_deps =
  miguelbalboa/MFRC522@^1.4.12
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.4.3
  adafruit/Adafruit SSD1306@^2.5.17
  adafruit/Adafruit GFX Library@^1.13.0
  adafruit/RTClib@^2.1.4
  chris--a/Keypad@^3.1.1

; Diagnostico aislado de la microSD: no inicializa RFID ni OLED.
;   pio run -e sdprobe -t upload
;   pio device monitor -e sdprobe
[env:sdprobe]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -I include
  -DCORE_DEBUG_LEVEL=3
build_src_filter =
  +<sd_probe.cpp>
